name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Build
        run: npm run build

      - name: Checkout API typecheck
        run: npm run typecheck:api

      - name: Setup Java for declared Firebase emulator tooling
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Catalog regressions and existing suites in isolation
        env:
          JAVA_TOOL_OPTIONS: -Duser.language=en -Duser.country=US
        run: npm run test:catalog

      - name: Verify checkout function packaging
        run: npm run check:checkout-packaging

      - name: Catalog desktop and mobile browser regressions
        env:
          JAVA_TOOL_OPTIONS: -Duser.language=en -Duser.country=US
        run: npm run test:catalog:browser
