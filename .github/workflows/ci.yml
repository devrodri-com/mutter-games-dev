name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/mutter-catalog-prep-r2-20260909

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify event checkout identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'event=%s\nref=%s\nexpected_sha=%s\nhead=%s\ntree=%s\n' "$EVENT_NAME" "$EVENT_REF" "$EXPECTED_SHA" "$actual_sha" "$actual_tree"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install root dependencies
        run: npm run install:controlled

      - name: Frontend source typecheck
        run: npm run typecheck:frontend

      - name: Published server source typecheck
        run: npm run typecheck:server

      - name: Build
        run: npm run build

      - name: Checkout API typecheck
        run: npm run typecheck:api

      - name: Setup Java for declared Firebase emulator tooling
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install retained source-comparison SDK without lifecycle scripts
        run: npm ci --prefix verification/retained-admin-api --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Cache the declared emulator before network isolation
        env:
          FIREBASE_EMULATORS_PATH: ${{ github.workspace }}/build-evidence/firebase-emulators
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
        run: node node_modules/firebase-tools/lib/bin/firebase.js setup:emulators:firestore

      # Use the exact eight-file gate reviewed for this release, with its current
      # cutover Rules/project and explicit historical comparison. The general
      # legacy discovery mixes recovery epochs and is retained as a separate tool.
      - name: Current published stock, checkout and Rules regressions
        run: |
          set -euo pipefail
          sudo -n env -i PATH="$PATH:/usr/sbin:/sbin" JAVA_HOME="$JAVA_HOME" \
            FIREBASE_EMULATORS_PATH="$GITHUB_WORKSPACE/build-evidence/firebase-emulators" \
            unshare --net --fork /bin/bash -c \
            'set -euo pipefail; ip link set dev lo up; python3 scripts/published/run-native.py native-ci'

      # Build verifies all six SPA files and the production module graph.
      # Runtime inputs are retained under scripts/published/runtime; CI cannot deploy.
