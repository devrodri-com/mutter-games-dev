name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/mutter-catalog-prep-r2-20260909
      - codex/mutter-web-stock-prep-20260928

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      WEB_INVENTORY_ADMIN_SHA: 70c45e4d74b1b1941435387e3ebf5fe7dbc8fd4d
      MUTTER_ADMIN_API_SOURCE: ${{ github.workspace }}/paired-admin-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify event checkout identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'event=%s\nref=%s\nexpected_sha=%s\nhead=%s\ntree=%s\n' "$EVENT_NAME" "$EVENT_REF" "$EXPECTED_SHA" "$actual_sha" "$actual_tree"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Build
        run: npm run build

      - name: Checkout API typecheck
        run: npm run typecheck:api

      - name: Checkout exact paired Admin inventory target
        uses: actions/checkout@v4
        with:
          repository: devrodri-com/mutter-games-admin-api
          ref: ${{ env.WEB_INVENTORY_ADMIN_SHA }}
          path: paired-admin-api
          persist-credentials: false

      - name: Verify paired Admin identity
        working-directory: paired-admin-api
        env:
          EXPECTED_SHA: ${{ env.WEB_INVENTORY_ADMIN_SHA }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'paired_admin_expected=%s\nhead=%s\ntree=%s\n' "$EXPECTED_SHA" "$actual_sha" "$actual_tree"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Install paired Admin dependencies
        working-directory: paired-admin-api
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Setup Java for declared Firebase emulator tooling
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Catalog regressions and existing suites in isolation
        env:
          JAVA_TOOL_OPTIONS: -Duser.language=en -Duser.country=US
        run: npm run test:catalog

      - name: Verify checkout function packaging
        run: npm run check:checkout-packaging

      # CI config selects the Chrome channel for Chromium and Playwright WebKit.
      - name: Prepare declared Playwright browsers
        run: node node_modules/@playwright/test/cli.js install --with-deps chrome webkit

      - name: Catalog desktop and mobile browser regressions
        env:
          JAVA_TOOL_OPTIONS: -Duser.language=en -Duser.country=US
          CATALOG_WEBKIT: '1'
        run: npm run test:catalog:browser
