name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - codex/mutter-catalog-prep-r2-20260909
      - codex/mutter-web-stock-prep-20260928

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      WEB_INVENTORY_ADMIN_SHA: 5a7184cff3ff6c4cff10fb85bb870bf3a4a98ee9
      MUTTER_ADMIN_API_SOURCE: ${{ github.workspace }}/paired-admin-api
      EDGE_TOOLING_EVIDENCE_DIR: ${{ github.workspace }}/../mutter-edge-controls-${{ github.run_id }}-${{ github.run_attempt }}
      CHECKOUT_PACKAGING_EVIDENCE_DIR: ${{ github.workspace }}/../mutter-edge-controls-${{ github.run_id }}-${{ github.run_attempt }}/emitted-functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify event checkout identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'event=%s\nref=%s\nexpected_sha=%s\nhead=%s\ntree=%s\n' "$EVENT_NAME" "$EVENT_REF" "$EXPECTED_SHA" "$actual_sha" "$actual_tree"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm run install:controlled

      - name: Install functions dependencies
        run: node scripts/braces-remediation/install.cjs functions

      - name: Source repair and actual consumer regressions
        run: npm run test:braces

      - name: Verify installed Edge exception and operational boundaries
        run: npm run check:edge-tooling

      - name: Edge control positive and negative regressions
        env:
          EDGE_CONTROL_TEST_EVIDENCE_DIR: ${{ env.EDGE_TOOLING_EVIDENCE_DIR }}/guard-observations
        run: |
          mkdir -p "$EDGE_TOOLING_EVIDENCE_DIR"
          npm run test:edge-tooling

      - name: Build
        id: spa-build
        run: npm run build

      - name: Checkout API typecheck
        run: npm run typecheck:api

      - name: Stock reconciliation API typecheck
        run: node node_modules/typescript/bin/tsc --noEmit --skipLibCheck --moduleResolution NodeNext --target ES2022 --module NodeNext --esModuleInterop api/internal/web-stock-reconcile.ts

      - name: Prebuilt control regressions
        run: npm run test:prebuilt

      - name: Cutover control regressions
        run: npm run test:release-cutover

      - name: Build complete isolated prebuilt from exact clean source
        run: node scripts/release-prebuilt/ci.cjs build "$RUNNER_TEMP/mutter-prebuilt"

      - name: Verify complete prebuilt
        run: node scripts/release-prebuilt/ci.cjs verify "$RUNNER_TEMP/mutter-prebuilt"

      - name: Prebuilt negative output regressions
        run: node scripts/release-prebuilt/ci.cjs negative "$RUNNER_TEMP/mutter-prebuilt"

      - name: Independently rebuild exact prebuilt
        run: node scripts/release-prebuilt/ci.cjs build "$RUNNER_TEMP/mutter-prebuilt-repeat"

      - name: Compare every deployable byte
        run: node scripts/release-prebuilt/ci.cjs compare "$RUNNER_TEMP/mutter-prebuilt" "$RUNNER_TEMP/mutter-prebuilt-repeat"

      - name: Archive diagnostic prebuilt without deployment
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/mutter-prebuilt.tar.gz" -C "$RUNNER_TEMP/mutter-prebuilt" .
          echo 'Candidate only: exact external paired gate, independent wiring review and operational cutover remain required. Native CI results stay unchanged.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve complete prebuilt and provenance
        uses: actions/upload-artifact@v4
        with:
          name: mutter-stock-prebuilt-CANDIDATE-PENDING-GATE-AUDIT-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutter-prebuilt.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Checkout exact paired Admin inventory target
        uses: actions/checkout@v4
        with:
          repository: devrodri-com/mutter-games-admin-api
          ref: ${{ env.WEB_INVENTORY_ADMIN_SHA }}
          path: paired-admin-api
          persist-credentials: false

      - name: Verify paired Admin identity
        working-directory: paired-admin-api
        env:
          EXPECTED_SHA: ${{ env.WEB_INVENTORY_ADMIN_SHA }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'paired_admin_expected=%s\nhead=%s\ntree=%s\n' "$EXPECTED_SHA" "$actual_sha" "$actual_tree"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Install paired Admin dependencies
        working-directory: paired-admin-api
        run: npm run install:controlled

      - name: Busboy regressions across the exact pair and functions
        run: node paired-admin-api/scripts/test-busboy.cjs . functions paired-admin-api

      - name: Setup Java for declared Firebase emulator tooling
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Catalog regressions and existing suites in isolation
        env:
          JAVA_TOOL_OPTIONS: -Duser.language=en -Duser.country=US
        run: npm run test:catalog

      - name: Verify checkout and stock reconciliation function packaging
        run: npm run check:checkout-packaging

      # CI config selects the Chrome channel for Chromium and Playwright WebKit.
      - name: Prepare declared Playwright browsers
        run: node node_modules/@playwright/test/cli.js install --with-deps chrome webkit

      - name: Catalog desktop and mobile browser regressions
        env:
          JAVA_TOOL_OPTIONS: -Duser.language=en -Duser.country=US
          CATALOG_WEBKIT: '1'
        run: npm run test:catalog:browser

      - name: Archive available Edge evidence; fail if a successful build lost it
        id: edge-archive
        if: always()
        env:
          SPA_BUILD_OUTCOME: ${{ steps.spa-build.outcome }}
        run: |
          set -euo pipefail
          if test "$SPA_BUILD_OUTCOME" = success; then
            test -s "$EDGE_TOOLING_EVIDENCE_DIR/spa/result.json"
            test -s "$EDGE_TOOLING_EVIDENCE_DIR/spa/spa-inventory.json"
          fi
          if test -d "$EDGE_TOOLING_EVIDENCE_DIR"; then
            tar -czf "$RUNNER_TEMP/edge-tooling-controls.tar.gz" -C "$EDGE_TOOLING_EVIDENCE_DIR" .
            echo 'available=true' >> "$GITHUB_OUTPUT"
          elif test "$SPA_BUILD_OUTCOME" = success; then
            echo 'Required evidence missing after a successful SPA build' >&2
            exit 1
          else
            echo 'No Edge artifact was produced before the failed/skipped build; preserve the actual job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve actual Edge control execution and emitted evidence
        if: always() && steps.edge-archive.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: edge-tooling-controls
          path: ${{ runner.temp }}/edge-tooling-controls.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Release gate positive and negative regressions
        run: npm run test:release-gate

      - name: Record actual build source and pair
        run: node scripts/release-gate/ci.cjs build frontend "$RUNNER_TEMP/release-build"

      - name: Preserve build binding
        uses: actions/upload-artifact@v4
        with:
          name: release-build-frontend-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-build
          if-no-files-found: error

  security:
    name: Security (${{ matrix.directory }}, ${{ matrix.scope }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', 'functions']
        scope: [prod, all]
    steps:
      - name: security prerequisite 1
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify security target
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git show -s --format='head=%H tree=%T'
      - name: security prerequisite 3
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: security prerequisite 4
        run: node scripts/braces-remediation/install.cjs "${{ matrix.directory }}"
      - name: Native required dependency audit
        run: node scripts/release-gate/audit.cjs frontend "${{ matrix.scope }}" "$RUNNER_TEMP/native-audit" "${{ matrix.directory }}"

      - name: Preserve original native audit and exit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-audit-${{ matrix.directory == '.' && 'root' || 'functions' }}-${{ matrix.scope }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-audit
          if-no-files-found: error

  first-cutover-controls:
    name: First cutover controls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify controls target
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'event=%s\nref=%s\nhead=%s\ntree=%s\n' "$EVENT_NAME" "$EVENT_REF" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"
      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Install exact declared dependencies
        run: npm run install:controlled
      - name: First cutover positive and negative policy controls
        run: npm run test:first-cutover
      - name: Preserve strict cutover controls
        run: npm run test:release-cutover
      - name: Setup Java for local persistence
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: First cutover selective recovery with real emulator
        env:
          JAVA_TOOL_OPTIONS: -Duser.language=en -Duser.country=US
        run: node node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --only firestore --project demo-mutter-first-cutover --config firebase.catalog-emulators.json "npm run test:first-cutover:emulator"

  source-remediation:
    name: Source remediation (does not waive native audit)
    needs: [build, security, first-cutover-controls]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: source-remediation prerequisite 1
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: source-remediation prerequisite 2
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Require actual paired compatibility gates
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CUTOVER_RESULT: ${{ needs.first-cutover-controls.result }}
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = success
          test "$CUTOVER_RESULT" = success
      - name: source-remediation prerequisite 4
        run: npm run install:controlled
      - name: source-remediation prerequisite 5
        run: node scripts/braces-remediation/install.cjs functions
      - name: source-remediation prerequisite 6
        run: npm run test:braces
      - name: source-remediation prerequisite 7
        uses: actions/download-artifact@v4
        with:
          pattern: native-audit-*
          path: audit-input
      - name: Assess exact source against all four original audit graphs
        run: |
          set -euo pipefail
          node scripts/braces-remediation/evaluate.cjs . audit-input/native-audit-root-prod-${{ github.run_attempt }} prod
          node scripts/braces-remediation/evaluate.cjs . audit-input/native-audit-root-all-${{ github.run_attempt }} all
          node scripts/braces-remediation/evaluate.cjs functions audit-input/native-audit-functions-prod-${{ github.run_attempt }} prod
          node scripts/braces-remediation/evaluate.cjs functions audit-input/native-audit-functions-all-${{ github.run_attempt }} all
          echo 'AUDITED_SOURCE_REPAIR_PRESERVED=YES; INDEPENDENT_RELEASE_GATE_AUDIT=PENDING; PRODUCTION_APPLICATION_AUTHORIZED=NO' >> "$GITHUB_STEP_SUMMARY"

      - name: Evaluate current security disposition
        env:
          RELEASE_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/release-gate/ci.cjs assess frontend "$RUNNER_TEMP/release-assessment" audit-input

      - name: Preserve security disposition binding
        uses: actions/upload-artifact@v4
        with:
          name: release-assessment-frontend-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-assessment
          if-no-files-found: error
